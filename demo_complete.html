<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParkTerm V2.0 - 完整功能演示</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0d1117;color:#c9d1d9;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* 顶部栏 */
.topbar{background:#161b22;border-bottom:1px solid #30363d;padding:0 16px;height:44px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.brand{font-size:15px;font-weight:700;color:#e6edf3}
.topbar-right{display:flex;align-items:center;gap:10px}
.topbar-addr{font-size:12px;color:#8b949e;font-family:'Cascadia Code',monospace}

/* 按钮 */
.btn{padding:6px 12px;border:1px solid #30363d;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,#3b82f6,#2563eb);color:#fff;border-color:#2563eb}
.btn-primary:hover{box-shadow:0 4px 12px rgba(59,130,246,.35);transform:translateY(-1px)}
.btn-secondary{background:#21262d;color:#c9d1d9}
.btn-secondary:hover{background:#30363d}
.btn-danger{background:#8b2020;color:#fff;border-color:#8b2020}
.btn-sm{padding:4px 10px;font-size:12px}

/* 主布局 */
.main-container{flex:1;display:flex;overflow:hidden}

/* 文件管理器 */
.fm-panel{width:320px;background:#0d1117;border-right:2px solid #30363d;display:flex;flex-direction:column;flex-shrink:0;position:relative;transition:width .3s}
.fm-panel.collapsed{width:40px;overflow:hidden}
.fm-toggle{position:absolute;right:-1px;top:50%;transform:translateY(-50%);width:16px;height:60px;background:#161b22;border:1px solid #30363d;border-right:none;border-radius:6px 0 0 6px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6e7681;z-index:10}
.fm-toggle:hover{background:#30363d;color:#c9d1d9}
.fm-head{padding:10px 12px;border-bottom:1px solid #30363d}
.fm-title{font-size:13px;font-weight:600;color:#c9d1d9;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.fm-path{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:4px;padding:6px 10px;color:#79c0ff;font-family:'Cascadia Code',monospace;font-size:12px;outline:none;margin-bottom:8px}
.fm-path:focus{border-color:#58a6ff}
.fm-actions{display:flex;gap:6px}
.fm-body{flex:1;overflow:auto;padding:8px}
.fm-file{display:flex;align-items:center;padding:6px 8px;border-radius:4px;cursor:pointer;transition:background .1s}
.fm-file:hover{background:#21262d}
.fm-file.selected{background:rgba(59,130,246,0.15)}
.fm-icon{width:24px;font-size:16px;text-align:center;margin-right:8px}
.fm-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fm-name.dir{color:#79c0ff}
.fm-meta{font-size:11px;color:#6e7681;margin-left:8px}
.fm-status{padding:8px 12px;border-top:1px solid #30363d;font-size:11px;color:#6e7681;background:#161b22}

/* 终端区域 */
.terminal-section{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

/* 工具栏 */
.toolbar{background:#161b22;border-bottom:1px solid #30363d;padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.toolbar-group{display:flex;gap:6px;align-items:center;padding-right:12px;border-right:1px solid #30363d}
.toolbar-group:last-child{border-right:none}
.toolbar-label{font-size:11px;color:#6e7681;text-transform:uppercase;letter-spacing:.5px}
.font-control{display:flex;align-items:center;gap:6px}
.font-btn{width:28px;height:28px;border-radius:4px;border:1px solid #30363d;background:#21262d;color:#c9d1d9;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
.font-btn:hover{background:#30363d}
.font-label{font-size:12px;color:#8b949e;min-width:40px;text-align:center}

/* 终端 */
#xterm-container{flex:1;overflow:hidden;padding:4px 8px;background:#0d1117}
.xterm{height:100%}

/* 状态栏 */
.status-bar{height:24px;background:#0d1117;border-top:1px solid #30363d;display:flex;align-items:center;padding:0 12px;gap:16px;font-size:10.5px;color:#6e7681;flex-shrink:0}
.status-item{display:flex;align-items:center;gap:4px}
.status-dot{width:6px;height:6px;border-radius:50%}
.status-dot.online{background:#3fb950}
.status-dot.offline{background:#6e7681}
.status-spacer{flex:1}

/* 右侧抽屉 */
.drawer{position:fixed;right:0;top:44px;bottom:24px;width:500px;background:#161b22;border-left:1px solid #30363d;transform:translateX(100%);transition:transform .3s ease;z-index:100;display:flex;flex-direction:column;box-shadow:-4px 0 20px rgba(0,0,0,.3)}
.drawer.open{transform:translateX(0)}
.drawer-header{background:#161b22;border-bottom:1px solid #30363d;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
.drawer-title{font-size:15px;font-weight:600;color:#c9d1d9;display:flex;align-items:center;gap:8px}
.drawer-close{width:32px;height:32px;border-radius:6px;border:none;background:transparent;color:#8b949e;cursor:pointer;display:flex;align-items:center;justify-content:center}
.drawer-close:hover{background:#21262d;color:#c9d1d9}
.drawer-body{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* 搜索 */
.search-box{padding:12px 16px;border-bottom:1px solid #30363d}
.search-wrap{position:relative}
.search-input{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:8px 12px 8px 36px;color:#c9d1d9;font-size:13px;outline:none}
.search-input:focus{border-color:#58a6ff}
.search-input::placeholder{color:#6e7681}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#6e7681}

/* 标签 */
.drawer-tabs{padding:10px 16px;display:flex;gap:8px;border-bottom:1px solid #30363d}
.tab-btn{padding:6px 14px;border-radius:16px;font-size:12px;background:#21262d;color:#8b949e;cursor:pointer;transition:all .15s;border:1px solid transparent}
.tab-btn:hover,.tab-btn.active{background:rgba(59,130,246,0.15);color:#58a6ff;border-color:rgba(59,130,246,0.3)}

/* 分类 */
.cmd-cats{padding:8px 16px;display:flex;flex-wrap:wrap;gap:6px;border-bottom:1px solid #30363d}
.cat-tag{padding:4px 10px;border-radius:12px;font-size:11px;background:#21262d;color:#8b949e;cursor:pointer;transition:all .15s}
.cat-tag:hover,.cat-tag.active{background:rgba(59,130,246,0.15);color:#58a6ff}
.cat-tag .cnt{background:#0d1117;padding:1px 5px;border-radius:8px;margin-left:4px;font-size:10px}

/* 命令列表 */
.cmd-list{flex:1;overflow-y:auto;padding:12px 16px}
.cmd-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmd-item{background:#0d1117;border:1px solid #21262d;border-radius:6px;padding:10px;transition:all .15s;cursor:pointer;display:flex;align-items:flex-start}
.cmd-item:hover{border-color:#58a6ff;transform:translateY(-1px)}
.cmd-left{flex:1;min-width:0}
.cmd-name{font-size:12px;font-weight:500;color:#c9d1d9;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-value{font-size:11px;color:#6e7681;font-family:'Cascadia Code',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmd-run{width:26px;height:26px;border-radius:4px;border:none;background:#3b82f6;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:8px}
.cmd-run:hover{background:#2563eb}

/* 历史 */
.history-list{flex:1;overflow-y:auto;padding:8px 16px}
.history-item{padding:8px 10px;border-radius:4px;cursor:pointer;margin-bottom:4px;font-family:'Cascadia Code',monospace;font-size:12px;color:#8b949e;transition:background .1s;display:flex;align-items:center}
.history-item:hover{background:#21262d;color:#c9d1d9}
.history-item .time{font-size:10px;color:#6e7681;margin-right:10px;flex-shrink:0}
.history-empty{padding:30px;text-align:center;color:#6e7681;font-size:13px}

/* 反馈 */
.feedback{position:fixed;bottom:40px;right:20px;background:#161b22;border:1px solid #30363d;border-radius:8px;padding:10px 16px;display:flex;align-items:center;gap:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:200;transform:translateY(80px);opacity:0;transition:all .3s}
.feedback.show{transform:translateY(0);opacity:1}
.feedback.success{border-color:#3fb950}
.feedback.info{border-color:#58a6ff}

/* 覆盖层 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;display:none}
.overlay.show{display:block}

/* 快捷键 */
.shortcuts{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#161b22;border:1px solid #30363d;border-radius:8px;padding:8px 16px;font-size:12px;color:#6e7681;display:flex;gap:16px;z-index:50}
.shortcuts kbd{background:#0d1117;border:1px solid #30363d;border-radius:4px;padding:2px 6px;font-family:'Cascadia Code',monospace;font-size:11px}

/* 欢迎 */
.welcome{flex:1;display:flex;align-items:center;justify-content:center;background:#0d1117}
.welcome.hidden{display:none}
.login-card{width:400px;max-width:90vw;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:32px;box-shadow:0 16px 48px rgba(0,0,0,.4)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:24px}
.login-logo span{font-size:20px;font-weight:700;color:#e6edf3}
.login-form{display:flex;flex-direction:column;gap:14px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:11px;color:#8b949e;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.form-group input{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px 12px;color:#c9d1d9;font-size:14px;outline:none;transition:border-color .2s}
.form-group input:focus{border-color:#58a6ff;box-shadow:0 0 0 2px rgba(88,166,255,.15)}
.login-btn{margin-top:6px;padding:12px;font-size:15px;font-weight:600;width:100%}
.login-tip{margin-top:16px;padding:12px;background:#0d1117;border:1px solid #21262d;border-radius:6px;font-size:12px;color:#8b949e;line-height:1.6}
.login-tip strong{color:#d29922}

/* 滚动条 */
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#484f58}
</style>
</head>
<body>

<!-- 顶部栏 -->
<div class="topbar">
  <div class="topbar-left">
    <span class="brand">ParkTerm</span>
    <span style="font-size:12px;color:#8b949e" id="sessionInfo">未连接</span>
  </div>
  <div class="topbar-right">
    <span class="topbar-addr" id="topbarAddr"></span>
    <button class="btn btn-secondary btn-sm" onclick="toggleDrawer('history')" title="命令历史">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      历史
    </button>
    <button class="btn btn-primary btn-sm" onclick="toggleDrawer('commands')" id="btnDrawer">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      命令
    </button>
    <button class="btn btn-secondary btn-sm" onclick="saveSession()" title="保存会话">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/></svg>
      保存
    </button>
    <button class="btn btn-danger btn-sm" id="btnDisconnect" style="display:none" onclick="doDisconnect()">断开</button>
  </div>
</div>

<!-- 主容器 -->
<div class="main-container">
  <!-- 文件管理器 -->
  <div class="fm-panel" id="fmPanel">
    <button class="fm-toggle" onclick="toggleFm()" id="fmToggleBtn" title="折叠">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div class="fm-head">
      <div class="fm-title">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#79c0ff" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        文件管理
      </div>
      <input type="text" class="fm-path" id="fmPath" value="/root">
      <div class="fm-actions">
        <button class="btn btn-sm btn-secondary" onclick="fmRefresh()">刷新</button>
        <button class="btn btn-sm btn-secondary" onclick="fmMkdir()">新建</button>
      </div>
    </div>
    <div class="fm-body" id="fmBody">
      <div class="fm-file"><span class="fm-icon">📁</span><span class="fm-name dir">.</span></div>
      <div class="fm-file"><span class="fm-icon">📁</span><span class="fm-name dir">..</span></div>
      <div class="fm-file" onclick="selectFile(this)"><span class="fm-icon">📁</span><span class="fm-name dir">config</span><span class="fm-meta">-</span></div>
      <div class="fm-file" onclick="selectFile(this)"><span class="fm-icon">📄</span><span class="fm-name">system.log</span><span class="fm-meta">2.3 MB</span></div>
      <div class="fm-file" onclick="selectFile(this)"><span class="fm-icon">📄</span><span class="fm-name">app.conf</span><span class="fm-meta">4 KB</span></div>
      <div class="fm-file" onclick="selectFile(this)"><span class="fm-icon">🗜️</span><span class="fm-name">backup.tar.gz</span><span class="fm-meta">15.2 MB</span></div>
    </div>
    <div class="fm-status" id="fmStatus">5 个文件 · 共 17.5 MB</div>
  </div>

  <!-- 终端区域 -->
  <div class="terminal-section">
    <div class="toolbar">
      <div class="toolbar-group">
        <span class="toolbar-label">快捷</span>
        <button class="btn btn-secondary btn-sm" onclick="quickCmd('ifconfig')">网口</button>
        <button class="btn btn-secondary btn-sm" onclick="quickCmd('free -m')">内存</button>
        <button class="btn btn-secondary btn-sm" onclick="quickCmd('df -h')">磁盘</button>
      </div>
      <div class="toolbar-group">
        <span class="toolbar-label">系统</span>
        <button class="btn btn-secondary btn-sm" onclick="quickCmd('uptime')">运行时间</button>
        <button class="btn btn-secondary btn-sm" onclick="quickCmd('top -bn1 | head -5')">进程</button>
      </div>
      <div class="toolbar-group font-control">
        <span class="toolbar-label">字号</span>
        <button class="font-btn" onclick="changeFont(-1)">A-</button>
        <span class="font-label" id="fontLabel">14px</span>
        <button class="font-btn" onclick="changeFont(1)">A+</button>
      </div>
    </div>
    <div id="xterm-container"></div>
  </div>
</div>

<!-- 状态栏 -->
<div class="status-bar">
  <div class="status-item"><span class="status-dot offline" id="connDot"></span><span id="connStatus">未连接</span></div>
  <div class="status-item">UTF-8</div>
  <div class="status-item" id="sbLevel">一级环境</div>
  <div class="status-spacer"></div>
  <div class="status-item">ParkTerm V2.0.12</div>
</div>

<!-- 覆盖层 -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>

<!-- 右侧抽屉 -->
<div class="drawer" id="drawer">
  <div class="drawer-header">
    <div class="drawer-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>
      <span id="drawerTitleText">常用命令</span>
    </div>
    <button class="drawer-close" onclick="closeDrawer()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="drawer-body">
    <div class="search-box">
      <div class="search-wrap">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索命令..." oninput="filterAll()">
      </div>
    </div>
    <div class="drawer-tabs">
      <button class="tab-btn active" onclick="switchTab('commands')" id="tabCommands">命令</button>
      <button class="tab-btn" onclick="switchTab('history')" id="tabHistory">历史</button>
    </div>
    <div id="panelCommands">
      <div class="cmd-cats" id="cmdCats"></div>
      <div class="cmd-list">
        <div class="cmd-grid" id="cmdGrid"></div>
      </div>
    </div>
    <div id="panelHistory" style="display:none">
      <div class="history-list" id="historyList">
        <div class="history-empty">暂无命令历史</div>
      </div>
    </div>
  </div>
</div>

<!-- 反馈 -->
<div class="feedback" id="feedback">
  <span id="feedbackIcon">✓</span>
  <span id="feedbackMsg">操作成功</span>
</div>

<!-- 快捷键 -->
<div class="shortcuts">
  <span><kbd>Ctrl+K</kbd> 命令面板</span>
  <span><kbd>Ctrl+H</kbd> 命令历史</span>
  <span><kbd>Ctrl+L</kbd> 清屏</span>
  <span><kbd>Esc</kbd> 关闭</span>
</div>

<!-- 欢迎界面 -->
<div class="welcome" id="welcome">
  <div class="login-card">
    <div class="login-logo">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      <span>ParkTerm</span>
    </div>
    <div class="login-form">
      <div class="form-group"><label>地址</label><input type="text" id="inputHost" value="192.168.1.60"></div>
      <div class="form-group"><label>端口</label><input type="number" id="inputPort" value="23333"></div>
      <div class="form-group"><label>用户名</label><input type="text" id="inputUser" value="root"></div>
      <div class="form-group"><label>密码</label><input type="password" id="inputPass"></div>
      <button class="btn btn-primary login-btn" onclick="doConnect()">连 接</button>
    </div>
    <div class="login-tip"><strong>提示：</strong>这是演示版本，点击连接将模拟SSH会话。</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.min.js"></script>
<script>
let term, fitAddon, isConnected = false, fontSize = 14;
let drawerOpen = false, currentTab = 'commands', currentCat = '全部', searchQ = '';
let history = [], fmCollapsed = false;

// TIO50命令数据
const CMDS = {
  "全部": [
    {n:"查看网络配置",c:"ifconfig"},{n:"查看路由表",c:"route -n"},{n:"测试连通性",c:"ping -c 4 8.8.8.8"},
    {n:"DNS解析",c:"nslookup www.baidu.com"},{n:"端口扫描",c:"netstat -tlnp"},{n:"查看进程",c:"ps aux"},
    {n:"实时监控",c:"top -bn1"},{n:"系统负载",c:"uptime"},{n:"内存使用",c:"free -m"},
    {n:"磁盘使用",c:"df -h"},{n:"文件系统检查",c:"fsck -n /dev/sda1"},{n:"块设备",c:"lsblk"},
    {n:"CPU信息",c:"cat /proc/cpuinfo"},{n:"内存详情",c:"cat /proc/meminfo"},{n:"内核版本",c:"uname -a"},
    {n:"系统版本",c:"cat /etc/euleros-release"},{n:"主机名",c:"hostname"},{n:"修改主机名",c:"hostnamectl set-hostname name"},
    {n:"开机日志",c:"dmesg | tail -50"},{n:"服务列表",c:"systemctl list-units --type=service"},{n:"服务状态",c:"systemctl status svc"},
    {n:"启动服务",c:"systemctl start svc"},{n:"停止服务",c:"systemctl stop svc"},{n:"开机自启",c:"systemctl enable svc"},
    {n:"系统日志",c:"journalctl -xe"},{n:"messages",c:"tail -f /var/log/messages"},{n:"登录日志",c:"lastlog"},

// 终端初始化
function initTerminal() {
  term = new Terminal({
    theme:{background:'#0d1117',foreground:'#c9d1d9',cursor:'#3b82f6',selectionBackground:'rgba(59,130,246,0.3)'},
    fontFamily:"'Cascadia Code','Fira Code',monospace",
    fontSize: fontSize,
    cursorBlink: true
  });
  fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('xterm-container'));
  setTimeout(() => { try { fitAddon.fit(); } catch(e) {} }, 100);
  window.addEventListener('resize', () => { if (fitAddon) setTimeout(() => { try { fitAddon.fit(); } catch(e) {} }, 50); });
}

// 连接
function doConnect() {
  const host = document.getElementById('inputHost').value;
  const port = document.getElementById('inputPort').value;
  const user = document.getElementById('inputUser').value;
  
  document.getElementById('welcome').classList.add('hidden');
  document.getElementById('btnDisconnect').style.display = '';
  document.getElementById('topbarAddr').textContent = `${host}:${port}`;
  document.getElementById('sessionInfo').textContent = `${user}@${host}`;
  document.getElementById('connDot').classList.add('online');
  document.getElementById('connDot').classList.remove('offline');
  document.getElementById('connStatus').textContent = '已连接';
  
  isConnected = true;
  if (!term) initTerminal();
  
  term.writeln('\x1b[32m╔══════════════════════════════════════════════════════════╗\x1b[0m');
  term.writeln('\x1b[1;36m║         欢迎使用 ParkTerm 终端管理系统 V2.0           ║\x1b[0m');
  term.writeln('\x1b[32m╚══════════════════════════════════════════════════════════╝\x1b[0m');
  term.writeln('');
  term.writeln(`  \x1b[33m连接:   \x1b[0m${host}:${port}`);
  term.writeln(`  \x1b[33m用户:   \x1b[0m${user}`);
  term.writeln(`  \x1b[33m系统:   \x1b[0mEulerOS 2.0 SP5`);
  term.writeln('');
  term.writeln('  \x1b[32m连接成功！点击右侧「命令」按钮查看常用命令。\x1b[0m');
  term.writeln('');
  term.write(`\x1b[1;32m${user}@localhost\x1b[0m:\x1b[1;34m~\x1b[0m$ `);
}

function doDisconnect() {
  if (term) term.writeln('\r\n\x1b[33m[断开连接]\x1b[0m');
  isConnected = false;
  document.getElementById('welcome').classList.remove('hidden');
  document.getElementById('btnDisconnect').style.display = 'none';
  document.getElementById('topbarAddr').textContent = '';
  document.getElementById('sessionInfo').textContent = '未连接';
  document.getElementById('connDot').classList.remove('online');
  document.getElementById('connDot').classList.add('offline');
  document.getElementById('connStatus').textContent = '未连接';
}

// 快速命令
function quickCmd(cmd) {
  if (!isConnected) { showFeedback('请先连接服务器', 'info'); return; }
  addHistory(cmd);
  const outputs = {
    'ifconfig': '\nethtx: flags=4163<UP,BROADCAST,RUNNING,MULTICAST>  mtu 1500\n        inet 192.168.1.60  netmask 255.255.255.0\n        ether 00:0c:29:ab:cd:ef\nlo: flags=73<UP,LOOPBACK,RUNNING>  mtu 65536\n',
    'free -m': '\n              total        used        free\nMem:          15949        3456        8923\nSwap:          8191           0        8191\n',
    'df -h': '\nFilesystem      Size  Used Avail Use%\n/dev/sda1       100G   45G   55G  45%\n/dev/sdb1       500G  234G  266G  47%\n',
    'uptime': '\n 10:30:45 up 128 days,  3:22,  2 users,  load average: 0.15\n',
    'top -bn1 | head -5': '\ntop - 10:30:45 up 128 days\nTasks: 156 total,   1 running\n%Cpu(s):  3.2 us\nMiB Mem : 15949.5 total\n'
  };
  const out = outputs[cmd] || '';
  term.write(`\r\n$ ${cmd}${out}\r\n`);
  term.write(`\x1b[1;32m${document.getElementById('inputUser').value}@localhost\x1b[0m:\x1b[1;34m~\x1b[0m$ `);
}

// 抽屉面板
function toggleDrawer(tab) {
  if (drawerOpen && currentTab === tab) {
    closeDrawer();
  } else {
    drawerOpen = true;
    currentTab = tab || 'commands';
    document.getElementById('drawer').classList.add('open');
    document.getElementById('overlay').classList.add('show');
    switchTab(currentTab);
  }
}

function closeDrawer() {
  drawerOpen = false;
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

function switchTab(tab) {
  currentTab = tab;
  document.getElementById('tabCommands').classList.toggle('active', tab === 'commands');
  document.getElementById('tabHistory').classList.toggle('active', tab === 'history');
  document.getElementById('panelCommands').style.display = tab === 'commands' ? '' : 'none';
  document.getElementById('panelHistory').style.display = tab === 'history' ? '' : 'none';
  document.getElementById('drawerTitleText').textContent = tab === 'commands' ? '常用命令' : '命令历史';
  if (tab === 'history') renderHistory();
}

function filterAll() {
  searchQ = document.getElementById('searchInput').value.toLowerCase();
  if (currentTab === 'commands') renderCommands();
}

function renderCats() {
  const container = document.getElementById('cmdCats');
  let html = `<span class="cat-tag ${currentCat === '全部' ? 'active' : ''}" onclick="selectCat('全部')">全部<span class="cnt">${CMDS['全部'].length}</span></span>`;
  Object.keys(CMDS).forEach(cat => {
    if (cat !== '全部') {
      html += `<span class="cat-tag ${currentCat === cat ? 'active' : ''}" onclick="selectCat('${cat}')">${cat}<span class="cnt">${CMDS[cat].length}</span></span>`;
    }
  });
  container.innerHTML = html;
}

function selectCat(cat) {
  currentCat = cat;
  renderCats();
  renderCommands();
}

function renderCommands() {
  const container = document.getElementById('cmdGrid');
  let cmds = currentCat === '全部' ? CMDS['全部'] : CMDS[currentCat];
  if (searchQ) {
    cmds = cmds.filter(c => c.n.toLowerCase().includes(searchQ) || c.c.toLowerCase().includes(searchQ));
  }
  if (!cmds.length) {
    container.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#6e7681">未找到匹配的命令</div>';
    return;
  }
  container.innerHTML = cmds.map(c => `
    <div class="cmd-item" title="${c.c}">
      <div class="cmd-left">
        <div class="cmd-name">${c.n}</div>
        <div class="cmd-value">${c.c}</div>
      </div>
      <button class="cmd-run" onclick="runCmd('${c.c.replace(/'/g, "\\'")}')" title="执行">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>
      </button>
    </div>
  `).join('');
}

function runCmd(cmd) {
  if (!isConnected) { showFeedback('请先连接服务器', 'info'); return; }
  addHistory(cmd);
  quickCmd(cmd);
}

// 历史
function addHistory(cmd) {
  if (!cmd.trim()) return;
  const time = new Date().toLocaleTimeString();
  history.unshift({ cmd: cmd.trim(), time });
  if (history.length > 100) history.pop();
}

function renderHistory() {
  const container = document.getElementById('historyList');
  if (!history.length) {
    container.innerHTML = '<div class="history-empty">暂无命令历史</div>';
    return;
  }
  container.innerHTML = history.map(h => `
    <div class="history-item" onclick="runHistory('${h.cmd.replace(/'/g, "\\'")}')">
      <span class="time">${h.time}</span>
      <span>${h.cmd}</span>
    </div>
  `).join('');
}

function runHistory(cmd) {
  if (isConnected) quickCmd(cmd);
}

// 文件管理
function toggleFm() {
  fmCollapsed = !fmCollapsed;
  document.getElementById('fmPanel').classList.toggle('collapsed', fmCollapsed);
  const btn = document.getElementById('fmToggleBtn');
  btn.innerHTML = fmCollapsed 
    ? '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>'
    : '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>';
}

function selectFile(el) {
  document.querySelectorAll('.fm-file').forEach(f => f.classList.remove('selected'));
  el.classList.add('selected');
}

function fmRefresh() { showFeedback('已刷新'); }
function fmMkdir() {
  const name = prompt('文件夹名称:');
  if (name) showFeedback(`已创建: ${name}`);
}

// 会话保存
function saveSession() {
  const data = {
    host: document.getElementById('inputHost').value,
    port: document.getElementById('inputPort').value,
    user: document.getElementById('inputUser').value,
    time: new Date().toISOString()
  };
  let sessions = JSON.parse(localStorage.getItem('pt_sessions') || '[]');
  sessions.unshift(data);
  localStorage.setItem('pt_sessions', JSON.stringify(sessions.slice(0, 10)));
  showFeedback('会话已保存');
}

// 字体
function changeFont(delta) {
  fontSize = Math.min(24, Math.max(10, fontSize + delta));
  document.getElementById('fontLabel').textContent = fontSize + 'px';
  if (term) {
    term.options.fontSize = fontSize;
    setTimeout(() => { try { fitAddon.fit(); } catch(e) {} }, 50);
  }
}

// 反馈
function showFeedback(msg, type = 'success') {
  const el = document.getElementById('feedback');
  document.getElementById('feedbackMsg').textContent = msg;
  el.className = `feedback ${type} show`;
  setTimeout(() => el.classList.remove('show'), 2000);
}

// 快捷键
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'k') { e.preventDefault(); toggleDrawer('commands'); }
  if (e.ctrlKey && e.key === 'h') { e.preventDefault(); toggleDrawer('history'); }
  if (e.ctrlKey && e.key === 'l') { e.preventDefault(); if (term) term.clear(); }
  if (e.key === 'Escape') closeDrawer();
});

// 初始化
document.addEventListener('DOMContentLoaded', () => {
  renderCats();
  renderCommands();
  const sessions = JSON.parse(localStorage.getItem('pt_sessions') || '[]');
  if (sessions.length > 0) {
    const last = sessions[0];
    document.getElementById('inputHost').value = last.host || '192.168.1.60';
    document.getElementById('inputPort').value = last.port || '23333';
    document.getElementById('inputUser').value = last.user || 'root';
  }
});
</script>
