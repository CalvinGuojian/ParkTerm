<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParkTerm</title>
<link rel="stylesheet" href="/static/css/xterm.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#1a1d23;color:#c9d1d9;height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ===== Top Bar ===== */
.topbar{background:#161b22;border-bottom:1px solid #30363d;padding:0 20px;height:44px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:10px;overflow:hidden}
.topbar-left svg{flex-shrink:0}
.topbar-left img{width:24px;height:24px;flex-shrink:0}
.topbar-left .brand{font-size:15px;font-weight:700;color:#e6edf3;letter-spacing:.3px;white-space:nowrap}
.product-info{display:flex;align-items:center;gap:16px;margin-left:4px;overflow:hidden}
.product-info .pi-badge{font-size:12px;padding:2px 8px;border-radius:10px;white-space:nowrap;background:transparent;color:#8b949e;border:1px solid #30363d}
.product-info .pi-badge b{color:#8b949e;font-weight:600}
.pi-label{font-size:11px;color:#6e7681;font-weight:500;text-transform:uppercase;letter-spacing:.5px;margin-left:8px;padding:2px 8px;border-radius:4px;background:rgba(59,130,246,0.1);border:1px solid rgba(59,130,246,0.2);color:#60a5fa}
.topbar-right{display:flex;align-items:center;gap:14px;flex-shrink:0}
.topbar-icons{display:flex;align-items:center;gap:4px;margin-right:4px}
.topbar-icon-btn{width:30px;height:30px;border-radius:7px;border:none;background:transparent;color:#9ca3af;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s}
.topbar-icon-btn:hover{background:#1f2937;color:#e6edf3}
.topbar-addr{font-size:12px;color:#8b949e;font-family:'Cascadia Code',monospace}
.status-badge{font-size:11px;padding:3px 10px;border-radius:12px;font-weight:500}
.status-disconnected{background:#30363d;color:#8b949e}
.status-connected{background:#1a4731;color:#3fb950}
.status-connecting{background:#4d2d00;color:#d29922}
.topbar-btns{display:flex;gap:6px}

/* ===== Buttons ===== */
.btn{padding:6px 14px;border:1px solid #30363d;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none}
.btn-primary{background:linear-gradient(135deg,#3b82f6 0%,#2563eb 100%);color:#fff;border-color:#2563eb}.btn-primary:hover{box-shadow:0 4px 12px rgba(59,130,246,.35);transform:translateY(-1px)}.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
.btn-danger{background:#8b2020;color:#fff;border-color:#8b2020}.btn-danger:hover{background:#b33030}
.btn-secondary{background:#21262d;color:#c9d1d9}.btn-secondary:hover{background:#30363d}
.btn-warning{background:linear-gradient(135deg,#f59e0b 0%,#d97706 100%);color:#fff;border-color:#d97706}.btn-warning:hover{box-shadow:0 4px 12px rgba(245,158,11,.3);transform:translateY(-1px)}
.btn-signal{background:#5a1a1a;color:#f85149;border-color:#5a1a1a;font-weight:600;font-family:'Cascadia Code',monospace;font-size:12px}
.btn-signal:hover{background:#8b2020;color:#fff}
.btn-file{background:#1a3a5c;color:#79c0ff;border-color:#1a3a5c}.btn-file:hover{background:#245180;color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-icon{padding:4px 8px;font-size:14px;line-height:1;min-width:28px;text-align:center}
.btn-topbar{padding:4px 12px;font-size:12px}

/* ===== Welcome Screen (Login) ===== */
.welcome-screen{flex:1;display:flex;align-items:center;justify-content:center;background:#1a1d23}
.welcome-screen.hidden{display:none}
.login-card{width:460px;max-width:90vw;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:32px;box-shadow:0 16px 48px rgba(0,0,0,.4)}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.login-logo svg{flex-shrink:0}
.login-logo img{width:28px;height:28px;flex-shrink:0}
.login-logo span{font-size:18px;font-weight:700;color:#e6edf3}
.login-subtitle{font-size:13px;color:#8b949e;margin-bottom:24px}
.login-form{display:flex;flex-direction:column;gap:14px}
.form-group{display:flex;flex-direction:column;gap:4px}
.form-group label{font-size:11px;color:#8b949e;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.form-group input{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:10px 12px;color:#c9d1d9;font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
.form-group input:focus{border-color:#58a6ff;box-shadow:0 0 0 2px rgba(88,166,255,.15)}
.login-btn{margin-top:6px;padding:10px;font-size:15px;font-weight:600;width:100%}
.login-tip{margin-top:16px;padding:12px;background:#0d1117;border:1px solid #21262d;border-radius:6px;font-size:12px;color:#8b949e;line-height:1.7}
.login-tip strong{color:#d29922}

/* Tooltip icon for port hint */
.tooltip-icon{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;margin-left:4px;border-radius:50%;background:#30363d;color:#8b949e;font-size:11px;font-weight:700;font-style:normal;line-height:1;cursor:help;position:relative;vertical-align:middle;flex-shrink:0}
.tooltip-icon:hover{background:#58a6ff;color:#fff}
.tooltip-icon .tooltip-text{visibility:hidden;opacity:0;transition:opacity .2s,visibility .2s;position:absolute;bottom:150%;left:50%;transform:translateX(-50%);background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px 14px;font-size:12px;color:#c9d1d9;font-weight:400;font-style:normal;white-space:nowrap;line-height:1.6;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.tooltip-icon .tooltip-text strong{color:#d29922}
.tooltip-icon:hover .tooltip-text{visibility:visible;opacity:1}

/* ===== Toolbar ===== */
.terminal-toolbar{background:#161b22;border-bottom:1px solid #30363d;padding:6px 16px;display:flex;flex-direction:column;gap:5px;flex-shrink:0}
.toolbar-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar-sep{width:1px;height:18px;background:#30363d;flex-shrink:0}
.toolbar-label{font-size:11px;color:#6e7681;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.toolbar-group-label{padding:0 2px;margin-right:2px;border-right:1px solid #21262d;padding-right:8px}

/* ===== Main area ===== */
.main-area{flex:1;display:none;overflow:hidden}
.main-area.active{display:flex}

/* ===== Terminal Pane ===== */
.terminal-pane{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#0d1117;min-width:300px;position:relative}
#xterm-container{flex:1;overflow:hidden;padding-left:8px}
#xterm-container .xterm{height:100%}
#xterm-container .xterm-viewport{overflow-y:auto}

/* ===== Status Bar (终端底部状态栏) ===== */
.status-bar{height:26px;background:#0d1117;border-top:1px solid #30363d;display:flex;align-items:center;padding:0 12px;gap:14px;font-size:10.5px;color:#6b7280;flex-shrink:0}
.status-bar .item{display:flex;align-items:center;gap:4px}
.status-bar .item .dot{width:6px;height:6px;border-radius:50%}
.status-bar .item .dot.g{background:#22c55e}
.status-bar .item .dot.b{background:#3b82f6}
.status-bar .spacer{flex:1}

/* ===== File Manager Resize Handle ===== */
.fm-resize-handle{position:absolute;right:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:10}
.fm-resize-handle:hover,.fm-resize-handle.active{background:rgba(88,166,255,.3)}

/* ===== Disabled button state ===== */
.btn-disabled-l2{background:#21262d !important;color:#484f58 !important;border-color:#30363d !important;cursor:not-allowed !important;opacity:1 !important}
.btn-disabled-l2:hover{background:#21262d !important}

/* ===== File Manager Panel (Left) — always visible ===== */
.fm-panel{width:380px;background:#0d1117;border-right:2px solid #30363d;display:flex;flex-direction:column;flex-shrink:0;position:relative}
.fm-head{background:#161b22;padding:8px 12px;border-bottom:1px solid #30363d}
.fm-head-row{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.fm-path{flex:1;background:#0d1117;border:1px solid #30363d;border-radius:4px;padding:4px 8px;color:#79c0ff;font-family:'Cascadia Code',monospace;font-size:12px;outline:none}
.fm-path:focus{border-color:#58a6ff}
.fm-actions{display:flex;gap:6px;flex-wrap:wrap}
.fm-body{flex:1;overflow:auto;font-size:13px}
.fm-table{width:100%;border-collapse:collapse}
.fm-table th{background:#161b22;color:#8b949e;font-size:13px;font-weight:500;text-transform:uppercase;letter-spacing:.5px;padding:6px 10px;text-align:left;position:sticky;top:0;z-index:1;border-bottom:1px solid #30363d}
.fm-table td{padding:5px 8px;border-bottom:1px solid #161b22;cursor:default;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.fm-table tr:hover td{background:#161b22}
.fm-table tr.fm-dir td{cursor:pointer}
.fm-table tr.fm-dir:hover td{background:#1a3a5c;color:#79c0ff}
.fm-table tr.fm-file-row{cursor:default}
.fm-table tr.fm-file-row:hover td{background:#161b22}
.fm-table tr.fm-selected td{background:#1a3a5c !important}
.fm-icon{width:20px;text-align:center;font-size:14px}
.fm-name{color:#e6edf3}.fm-dir .fm-name{color:#79c0ff;font-weight:500}
.fm-size{color:#8b949e;text-align:right;font-size:12px}
.fm-time{color:#6e7681;font-size:12px}
.fm-ops{white-space:nowrap;width:60px;text-align:center}
.fm-ops-btn{cursor:pointer;padding:2px 5px;border-radius:3px;font-size:13px;transition:background .15s;display:inline-block;vertical-align:middle}
.fm-ops-btn:hover{background:#30363d}
.fm-ops-btn.op-del{color:#f85149}
.fm-ops-btn.op-dl{color:#79c0ff}
.fm-empty{padding:30px;text-align:center;color:#484f58;font-size:13px}
.fm-status{padding:6px 12px;border-top:1px solid #30363d;font-size:11px;color:#6e7681;text-align:right;flex-shrink:0}

/* Transfer Progress Bar */
.fm-progress{border-top:1px solid #30363d;padding:8px 12px;background:#161b22;flex-shrink:0}
.fm-progress.hidden{display:none}
.fm-progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:12px}
.fm-progress-name{color:#79c0ff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.fm-progress-detail{color:#8b949e;white-space:nowrap;margin-left:8px}
.fm-progress-track{height:4px;background:#21262d;border-radius:2px;overflow:hidden}
.fm-progress-fill{height:100%;background:linear-gradient(90deg,#238636,#3fb950);border-radius:2px;transition:width .3s ease;width:0}
.fm-progress-status{font-size:11px;color:#6e7681;margin-top:4px}

/* ===== Context Menu ===== */
.ctx-menu{position:fixed;z-index:2000;background:#1c2128;border:1px solid #30363d;border-radius:8px;padding:4px 0;min-width:160px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.ctx-menu.hidden{display:none}
.ctx-menu-item{padding:7px 16px;font-size:13px;color:#c9d1d9;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .1s}
.ctx-menu-item:hover{background:#30363d}
.ctx-menu-item.ctx-danger{color:#f85149}
.ctx-menu-item.ctx-danger:hover{background:#5a1a1a}
.ctx-menu-sep{height:1px;background:#30363d;margin:4px 0}

/* ===== Password Toggle ===== */
.pwd-wrapper{position:relative;margin-bottom:14px}
.pwd-wrapper input{display:block;width:100%;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px 40px 10px 12px;color:#c9d1d9;font-size:14px;outline:none;line-height:1.5;box-sizing:border-box}
.pwd-wrapper input:focus{border-color:#58a6ff;box-shadow:0 0 0 2px rgba(88,166,255,.15)}
.pwd-wrapper input.pwd-hidden{-webkit-text-security:disc;text-security:disc}
.pwd-toggle{position:absolute;right:8px;top:0;bottom:0;width:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#6e7681;background:none;border:none;padding:0;margin:0}
.pwd-toggle:hover{color:#c9d1d9}
.pwd-toggle svg{width:16px;height:16px;display:block}

/* ===== Modals ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(2px)}
.modal-overlay.hidden{display:none}
.modal-box{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;width:420px;max-width:90vw;box-shadow:0 16px 48px rgba(0,0,0,.4)}
.modal-box h3{font-size:17px;color:#e6edf3;margin-bottom:12px;font-weight:600}
.modal-box p{font-size:13px;color:#8b949e;margin-bottom:14px;line-height:1.6}
.modal-box input[type="text"]{width:100%;background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:10px 12px;color:#c9d1d9;font-size:14px;outline:none;margin-bottom:14px}
.modal-box input[type="text"]:focus{border-color:#58a6ff;box-shadow:0 0 0 2px rgba(88,166,255,.15)}
.modal-status{font-size:13px;margin-bottom:12px;min-height:20px}
.modal-actions{display:flex;gap:10px;justify-content:flex-end}

/* ===== 抓包弹窗（仅覆盖右侧终端窗口，居中） ===== */
.cap-layer{position:absolute;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:50;backdrop-filter:blur(2px);overflow:auto}
.cap-layer.hidden{display:none}

/* 抓包管理列表 */
.capture-card{width:860px;max-width:96%;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:22px;box-shadow:0 16px 48px rgba(0,0,0,.4)}
.capture-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.capture-header svg{flex-shrink:0;color:#79c0ff}
.capture-title{font-size:17px;font-weight:700;color:#e6edf3}
.capture-subtitle{font-size:12px;color:#8b949e;margin:0 0 16px;line-height:1.6;max-width:840px}
.capture-list{border:1px solid #30363d;border-radius:8px;background:#0d1117;overflow:hidden;margin-bottom:18px}
.c-head{display:grid;grid-template-columns:240px 1fr 0.7fr 0.8fr 0.8fr 88px 92px;gap:10px;padding:10px 10px;align-items:center;background:#161b22;border-bottom:1px solid #30363d}
.c-head span{font-size:12px;font-weight:600;color:#b6c0ca}
.c-head .h-act{text-align:left}
.capture-item{display:grid;grid-template-columns:240px 1fr 0.7fr 0.8fr 0.8fr 88px 92px;align-items:center;gap:10px;padding:12px 10px;border-bottom:1px solid #21262d;transition:background .15s}
.capture-item:last-child{border-bottom:none}
.capture-item:hover{background:#161b22}
.c-name{font-size:12px;font-weight:400;color:#c9d1d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-field{font-size:12px;color:#c9d1d9;line-height:1.55;word-break:break-all;display:flex;align-items:center}
.c-field .all{color:#8b949e}
.c-field.c-cmd{color:#79c0ff;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.c-target{font-size:12px;color:#c9d1d9;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-badge{font-size:12px;font-weight:600;height:24px;min-width:68px;padding:0 6px;border-radius:10px;white-space:nowrap;line-height:1;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;justify-self:start}
.status-pending{background:#21262d;color:#8b949e}
.status-running{background:#1a4731;color:#3fb950}
.status-ended{background:#1a3a5c;color:#79c0ff}
.c-actions{display:flex;gap:5px;justify-content:flex-start;align-items:center}
.c-actions button{border:none;border-radius:8px;width:26px;height:24px;cursor:pointer;transition:filter .15s;line-height:1;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;padding:0;color:#fff}
.c-actions button:hover{filter:brightness(1.1)}
.c-actions button svg{width:14px;height:14px;display:block}
.c-actions button.btn-start{background:#238636}
.c-actions button.btn-stop{background:#d29922}
.c-actions button.btn-dl{background:#1f6feb}
.c-actions button.btn-del{background:#da3633}
.capture-empty{padding:30px;text-align:center;color:#484f58;font-size:13px}
.capture-footer{display:flex;gap:10px;justify-content:flex-end}
/* 新增抓包表单 */
.capture-new-card{width:440px;max-width:92%;background:#161b22;border:1px solid #30363d;border-radius:12px;padding:32px;box-shadow:0 16px 48px rgba(0,0,0,.4)}
.capture-new-card .login-logo{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.capture-new-card .login-logo svg{flex-shrink:0;color:#79c0ff}
.capture-new-card .login-logo span{font-size:18px;font-weight:700;color:#e6edf3}
.cap-form{display:flex;flex-direction:column;gap:5px;margin-bottom:15px}
.cap-form > label{font-size:12px;color:#8b949e;font-weight:500}
.cap-form input{background:#0d1117;border:1px solid #30363d;border-radius:6px;padding:9px 12px;color:#c9d1d9;font-size:14px;outline:none;transition:border-color .2s}
.cap-form input:focus{border-color:#58a6ff;box-shadow:0 0 0 2px rgba(88,166,255,.15)}
.cap-form input::placeholder{color:#6e7681;font-size:13px}
.cap-note{font-size:11px;color:#6e7681;margin-top:-6px;margin-bottom:10px;line-height:1.5}
.cap-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}

/* ===== Scrollbar ===== */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:5px;border:2px solid #0d1117}
::-webkit-scrollbar-thumb:hover{background:#484f58}

/* ===== Spinner ===== */
.spinner{display:inline-block;width:13px;height:13px;border:2px solid #30363d;border-top-color:#58a6ff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- ===== Top Bar ===== -->

<script>
// ================================================================
//  Global State
// ================================================================
var sessionId = null;
var socket = null;
var term = null;
var fitAddon = null;
var isConnecting = false;
var fmCurrentPath = '/';
var level2Done = false;
var pendingUploadFile = null;
var connHost = '';
var connPort = 23333;
var currentTransferId = null;
var ctxTarget = null;
var deviceVersion = ''; // 存储设备版本号，供服务查看自动识别命令
var needLevel2 = false;  // 当前是否处于需二级才能解锁的功能受限环境

// ================================================================
//  Electerm Dark Theme
// ================================================================
var electermTheme = {
  background: '#0a0e1a',
  foreground: '#c9d1d9',
  cursor: '#3b82f6',
  cursorAccent: '#0a0e1a',
  selectionBackground: 'rgba(59,130,246,0.3)',
  black: '#484f58',
  red: '#f85149',
  green: '#22c55e',
  yellow: '#d29922',
  blue: '#3b82f6',
  magenta: '#bc8cff',
  cyan: '#39c5cf',
  white: '#c9d1d9',
  brightBlack: '#6e7681',
  brightRed: '#ff7b72',
  brightGreen: '#4ade80',
  brightYellow: '#e3b341',
  brightBlue: '#60a5fa',
  brightMagenta: '#d2a8ff',
  brightCyan: '#56d4dd',
  brightWhite: '#f0f6fc'
};

// ================================================================
//  Topbar Dynamic Buttons
// ================================================================
function updateTopbarBtns() {
  var el = document.getElementById('topbarBtns');
  if (sessionId) {
    el.innerHTML = '<button class="btn btn-danger btn-topbar" onclick="doDisconnect()">断开连接</button>';
  } else {
    el.innerHTML = '';
  }
}

// ================================================================
//  Terminal Initialization
// ================================================================
function initTerminal() {
  if (term) { term.dispose(); term = null; }

  term = new Terminal({
    theme: electermTheme,
    fontFamily: "'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', 'Courier New', monospace",
    fontSize: 14,
    lineHeight: 1.35,
    cursorBlink: true,
    cursorStyle: 'block',
    scrollback: 5000,
    convertEol: true,
    allowProposedApi: true
  });

  fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.loadAddon(new WebLinksAddon.WebLinksAddon());

  var container = document.getElementById('xterm-container');
  container.innerHTML = '';
  term.open(container);

  requestAnimationFrame(function() {
    try { fitAddon.fit(); } catch(e) {}
  });

  term.onData(function(data) {
    if (socket && socket.connected && sessionId) {
      socket.emit('term-input', { data: data });
    }
  });

  term.onBinary(function(data) {
    if (socket && socket.connected && sessionId) {
      socket.emit('term-input', { data: data });
    }
  });

  term.onResize(function(size) {
    if (socket && socket.connected && sessionId) {
      socket.emit('term-resize', { cols: size.cols, rows: size.rows });
    }
  });

  term.attachCustomKeyEventHandler(function(ev) {
    return true;
  });

  window.addEventListener('resize', function() {
    if (fitAddon && term) {
      requestAnimationFrame(function() { try { fitAddon.fit(); } catch(e) {} });
    }
  });
}

// ================================================================
//  Socket.IO
// ================================================================
function initSocket() {
  if (socket) { socket.removeAllListeners(); socket.disconnect(); socket = null; }

  socket = io({ reconnection: true, reconnectionAttempts: 10, reconnectionDelay: 1000, timeout: 10000 });

  socket.on('connect', function() {
    if (sessionId) socket.emit('term-init', { session_id: sessionId });
  });

  socket.on('term-ready', function() {
    if (term) {
      term.focus();
      requestAnimationFrame(function() { try { fitAddon.fit(); } catch(e) {} });
    }
  });

  socket.on('term-data', function(data) {
    if (term) term.write(data);
  });

  socket.on('term-disconnect', function() {
    if (term) term.write('\r\n\x1b[31m[连接已断开]\x1b[0m\r\n');
    setStatus('disconnected', '已断开');
    sessionId = null;
    updateTopbarBtns();
  });

  socket.on('term-error', function(msg) {
    if (term) term.write('\r\n\x1b[31m[错误] ' + msg + '\x1b[0m\r\n');
  });

  // Transfer progress from backend (SFTP phase)
  socket.on('transfer-progress', function(data) {
    console.log('[TransferProgress]', data);
    if (data.transfer_id === currentTransferId) {
      updateProgressBar(data.transferred, data.total, data.percent);
    }
  });

  socket.on('connect_error', function() {});
  socket.on('disconnect', function() {});
}

// ================================================================
//  UI Helpers
// ================================================================
function setStatus(s, t) {
  var b = document.getElementById('statusBadge');
  b.className = 'status-badge status-' + s;
  b.textContent = t;
}

function setConnected(c, host, port) {
  document.getElementById('welcomeScreen').classList.toggle('hidden', c);
  document.getElementById('mainArea').classList.toggle('active', c);

  if (c) {
    connHost = host;
    connPort = port;
    document.getElementById('topbarAddr').textContent = host + ':' + port;
    setStatus('connected', '已连接');
    // 更新底部状态栏
    var sb = document.getElementById('statusBar');
    if (sb) {
      document.getElementById('sbConn').textContent = 'SSH 已连接';
      document.getElementById('sbLatency').textContent = '延迟 --';
      document.getElementById('sbLevel').textContent = '一级环境';
    }
    level2Done = false;
    needLevel2 = false;
    setLevel2Gating(false);   // 连接初始先解锁，autoCheckLevel1 会按需置灰
    deviceVersion = '';
    document.getElementById('fmBody').innerHTML = '<div class="fm-empty"><span class="spinner"></span> 加载中...</div>';
    document.getElementById('fmItemCount').textContent = '';
    document.getElementById('productInfo').innerHTML = '';

    // Reset level 2 button
    var btn2 = document.getElementById('btnLevel2');
    btn2.disabled = false;
    btn2.classList.remove('btn-disabled-l2');
    btn2.title = '';
    btn2.textContent = '进入二级';
    btn2.style.display = 'none';

    initTerminal();
    initSocket();
    initFMResize();
    updateTopbarBtns();

    // Load file manager immediately (independent of level-1/level-2 status)
    // and start device info + level-1 check in parallel
    setTimeout(function() { fmRefresh(); }, 800);
    setTimeout(function() { autoCheckLevel1(); }, 1200);
    setTimeout(function() { fetchDeviceInfo(0); }, 1500);
  } else {
    document.getElementById('topbarAddr').textContent = '';
    setStatus('disconnected', '');
    if (socket) { socket.removeAllListeners(); socket.disconnect(); socket = null; }
    if (term) { term.dispose(); term = null; }
    document.getElementById('productInfo').innerHTML = '';
    document.getElementById('fmBody').innerHTML = '<div class="fm-empty">未连接</div>';
    document.getElementById('fmItemCount').textContent = '';
    fmCurrentPath = '/';
    level2Done = false;
    needLevel2 = false;
    setLevel2Gating(false);
    deviceVersion = '';
    var btn2 = document.getElementById('btnLevel2');
    btn2.style.display = 'none';
    btn2.disabled = false;
    btn2.classList.remove('btn-disabled-l2');
    btn2.title = '';
    btn2.textContent = '进入二级';
    updateTopbarBtns();
  }
}

async function autoCheckLevel1() {
  if (!sessionId) return;
  try {
    var r = await api('check_level1', { session_id: sessionId });
    if (r.ok && r.need_level2 === true) {
      // Need level 2 — show button, prompt, and grey out restricted tools.
      var btn2 = document.getElementById('btnLevel2');
      btn2.style.display = '';
      setLevel2Gating(true);
      if (term) {
        // Keep the current (yellow) color, but use the plain terminal font
        // (like the 内存查看 command output) — no bold emphasis.
        term.write('\r\n\x1b[33m当前为后台一级环境，部分命令不识别，如需获取完整权限请点击工具栏 “进入二级” 按钮！\x1b[0m');
        socket.emit('term-input', { data: '\n' });
      }
      // Ensure one fresh newline (send Enter) so the shell prompt drops to a new line.
      setTimeout(function() {
        if (socket && sessionId) {
          socket.emit('term-input', { data: '\n' });
        }
      }, 500);
    } else {
      // Level-1 with full access (or unknown) — unlock the restricted tools.
      setLevel2Gating(false);
    }
    // In all cases: file manager already loaded, no action needed here
  } catch(e) {
    console.log('[autoCheckLevel1] error:', e);
  }
}

async function api(ep, d) {
  var r = await fetch('/api/' + ep, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(d) });
  return r.json();
}

// ================================================================
//  Device Info (Product Model, Version, Serial)
// ================================================================
// Retry intervals: 1s, 5s, 10s, 30s, 60s (5 retries)
var DEVICE_INFO_RETRY_DELAYS = [1000, 5000, 10000, 30000, 60000];

async function fetchDeviceInfo(retryCount) {
  if (!sessionId) return;
  if (retryCount === 0) {
    document.getElementById('productInfo').innerHTML = '<span style="color:#6e7681;font-size:11px"><span class="spinner"></span>加载设备信息...</span>';
  } else {
    document.getElementById('productInfo').innerHTML = '<span style="color:#6e7681;font-size:11px"><span class="spinner"></span>重新获取(' + (retryCount) + '/5)...</span>';
  }
  try {
    var r = await api('device_info', { session_id: sessionId });
    console.log('[DeviceInfo] response (retry ' + retryCount + '):', r);
    if (r.ok && r.info) {
      var info = r.info;
      var hasAny = info.device_name || info.pub || info.serial_number;
      if (hasAny) {
        deviceVersion = info.pub || ''; // 保存版本号供服务查看使用
        var html = '';
        if (info.device_name) {
          html += '<span class="pi-badge"><b>型号：</b>' + escHtml(info.device_name) + '</span>';
        }
        if (info.pub) {
          html += '<span class="pi-badge"><b>版本：</b>' + escHtml(info.pub) + '</span>';
        }
        if (info.serial_number) {
          html += '<span class="pi-badge"><b>SN：</b>' + escHtml(info.serial_number) + '</span>';
        }
        document.getElementById('productInfo').innerHTML = html;
        return;
      }
      // No fields parsed — treat as failure, retry if possible
      console.log('[DeviceInfo] no fields parsed from:', info);
    } else {
      console.log('[DeviceInfo] API failed:', r);
    }
    // Retry logic
    if (retryCount < DEVICE_INFO_RETRY_DELAYS.length) {
      var delay = DEVICE_INFO_RETRY_DELAYS[retryCount];
      console.log('[DeviceInfo] will retry in ' + (delay/1000) + 's (attempt ' + (retryCount+1) + '/' + DEVICE_INFO_RETRY_DELAYS.length + ')');
      setTimeout(function() { fetchDeviceInfo(retryCount + 1); }, delay);
    } else {
      document.getElementById('productInfo').innerHTML = '';
      console.log('[DeviceInfo] all retries exhausted');
    }
  } catch(e) {
    console.log('[DeviceInfo] exception:', e);
    if (retryCount < DEVICE_INFO_RETRY_DELAYS.length) {
      var delay2 = DEVICE_INFO_RETRY_DELAYS[retryCount];
      setTimeout(function() { fetchDeviceInfo(retryCount + 1); }, delay2);
    } else {
      document.getElementById('productInfo').innerHTML = '';
    }
  }
}

// ================================================================
//  Connection
// ================================================================
async function doConnect() {
  if (isConnecting) return;
  isConnecting = true;

  var host = document.getElementById('inputHost').value.trim();
  var port = parseInt(document.getElementById('inputPort').value) || 23333;
  var user = document.getElementById('inputUser').value.trim();
  var pass = document.getElementById('inputPass').value;

  if (!host || !user) { alert('请填写主机地址和用户名'); isConnecting = false; return; }

  var btn = document.getElementById('btnConnect');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>连接中...';
  setStatus('connecting', '连接中...');

  try {
    var r = await api('connect', { host: host, port: port, username: user, password: pass });
    if (r.ok) {
      sessionId = r.session_id;
      setConnected(true, host, port);
    } else {
      setStatus('disconnected', '失败');
      alert('连接失败: ' + r.error);
    }
  } catch (e) {
    setStatus('disconnected', '异常');
    alert('连接异常: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = '连 接';
    isConnecting = false;
  }
}

async function doDisconnect() {
  if (sessionId) {
    try { await api('disconnect', { session_id: sessionId }); } catch(e) {}
  }
  // Clear password, keep host/port/username for convenience
  document.getElementById('inputPass').value = '';
  // Reset state and return to login screen
  sessionId = null;
  setConnected(false);
  // Focus password field for quick reconnect
  setTimeout(function() { document.getElementById('inputPass').focus(); }, 100);
}

// 二级环境受限时，将内存查看/磁盘空间查看/抓包管理置灰并提示。

  needLevel2 = need;
  ['btnMem', 'btnDisk', 'btnCapture'].forEach(function(id) {
    var b = document.getElementById(id);
    if (!b) return;
    if (need) {
      b.classList.add('btn-disabled-l2');
      b.disabled = true;
      b.title = '进入二级后解锁';
    } else {
      b.classList.remove('btn-disabled-l2');
      b.disabled = false;
      b.title = '';
    }
  });
}

  // 置灰按钮的 title 已提供悬浮提示；此处不再弹窗打扰。
}

// 根据版本号自动识别服务查看命令
function viewService() {
  if (!sessionId || !socket || !socket.connected) { alert('请先连接服务器'); return; }
  var v = deviceVersion.toUpperCase();
  var cmd = '';
  if (v.indexOf('VMS-B') === 0) {
    cmd = 'server.sh status';
  } else if (v.indexOf('EGS-') === 0) {
    cmd = 'FastGateServer.sh status';
  } else if (v.indexOf('PARK-') === 0) {
    cmd = 'SPARKServer.sh status';
  }
  if (cmd) {
    socket.emit('term-input', { data: cmd + '\n' });
  } else {
    // 未知版本，终端打印提示
    if (term) {
      term.write('\r\n\x1b[33m查看服务命令执行失败，请手动执行相应命令\x1b[0m\r\n');
    }
  }
}

function sendSignal(sig) {
  if (!sessionId || !socket || !socket.connected) return;
  var signals = { 'Ctrl+C': '\x03' };
  var char = signals[sig];
  if (char) socket.emit('term-input', { data: char });
}

function initFMResize() {
  var handle = document.getElementById('fmResizeHandle');
  var panel = document.getElementById('fmPanel');
  if (!handle || !panel) return;
  var startX, startW;

  handle.onmousedown = function(e) {
    e.preventDefault();
    startX = e.clientX;
    startW = panel.offsetWidth;
    handle.classList.add('active');
    document.onmousemove = function(e) {
      var w = startW + (e.clientX - startX);
      if (w < 260) w = 260;
      if (w > 700) w = 700;
      panel.style.width = w + 'px';
    };
    document.onmouseup = function() {
      document.onmousemove = null;
      document.onmouseup = null;
      handle.classList.remove('active');
      if (fitAddon) requestAnimationFrame(function() { try { fitAddon.fit(); } catch(e) {} });
    };
  };
}

async function doLevel2() {
  var p = document.getElementById('inputLevel2Pass').value;
  closeLevel2Modal();
  // Dynamic dots animation
  var dotCount = 0;
  var dotInterval = setInterval(function() {
    if (!term) return;
    var dots = '.'.repeat(Math.min(dotCount, 20));
    term.write('\r\x1b[36m正在进入二级环境，请稍候' + dots + '    \x1b[0m');
    dotCount++;
  }, 300);
  try {
    var r = await api('level2', { session_id: sessionId, password: p });
    clearInterval(dotInterval);
    if (r.ok && r.level2_ok) {
      // Success: clear the "正在进入" line and confirm with one line.
      if (term) {
        term.write('\r\x1b[2K\x1b[32m已成功进入二级！\x1b[0m\r\n');
        // Auto-send Enter to get a fresh shell prompt on a new line.
        socket.emit('term-input', { data: '\n' });
      }
      level2Done = true;
      // 更新底部状态栏权限等级
      if (document.getElementById('sbLevel')) {
        document.getElementById('sbLevel').textContent = '二级环境';
      }
      fmRefresh();
      setLevel2Gating(false);   // 进入二级成功，解锁内存/磁盘/抓包管理
      var btn2 = document.getElementById('btnLevel2');
      btn2.disabled = true;
      btn2.classList.add('btn-disabled-l2');
      btn2.title = '当前已进入二级环境，无需重复进入';
    } else if (r.ok && !r.level2_ok) {
      // Wrong password (or other backend refusal): show the device's own
      // output in RED, same terminal font as the surrounding text.
      if (term) {
        term.write('\r\x1b[2K');
        var out = (r.output || '二级登录失败').trim();
        // Strip any ANSI the device may have sent, then color it red.
        out = out.replace(/\x1b\[[0-9;]*[A-Za-z]/g, '').replace(/\x1b\][^\x07]*\x07/g, '');
        term.write('\x1b[31m' + out + '\x1b[0m\r\n');
      }
    } else {
      // Backend exception
      if (term) term.write('\r\x1b[2K\x1b[31m[二级登录失败] ' + escHtml(r.error) + '\x1b[0m\r\n');
    }
  } catch (e) {
    clearInterval(dotInterval);
    if (term) term.write('\r\x1b[2K\x1b[31m[错误] ' + escHtml(e.message) + '\x1b[0m\r\n');
  }
}

function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return escHtml(s).replace(/"/g,'&quot;'); }

function fmIcon(item) {
  if (item.is_dir) return '<span style="color:#79c0ff">&#128193;</span>';
  var ext = (item.name.split('.').pop() || '').toLowerCase();
  var m = {

  };
  return m[ext] || '<span style="color:#6e7681">&#128196;</span>';

function fmSize(n){if(!n)return'-';if(n<1024)return n+'B';if(n<1048576)return(n/1024).toFixed(1)+'K';if(n<1073741824)return(n/1048576).toFixed(1)+'M';return(n/1073741824).toFixed(1)+'G';}
function fmTime(ts){if(!ts)return'-';var d=new Date(ts*1000);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');}

async function fmNavigate(path) {
  if (!sessionId) return;
  fmCurrentPath = path;
  document.getElementById('fmPath').value = path;
  document.getElementById('fmBody').innerHTML = '<div class="fm-empty"><span class="spinner"></span> 加载中...</div>';
  try {
    var r = await fetch('/api/sftp_ls', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: sessionId, path: path }) });
    var res = await r.json();
    if (!res.ok) {
      if (res.need_level2) {
        document.getElementById('fmBody').innerHTML = '<div class="fm-empty" style="color:#d29922">当前为后台一级受限环境，文件管理暂不可用<br><br><button class="btn btn-warning btn-sm" onclick="showLevel2Modal()">进入二级后重试</button></div>';
        return;
      }
      document.getElementById('fmBody').innerHTML = '<div class="fm-empty" style="color:#f85149">'+escHtml(res.error)+'<br><br><button class="btn btn-sm btn-secondary" onclick="fmRefresh()">点此重试</button></div>';
      return;
    }
    if (!res.items || !res.items.length) { document.getElementById('fmBody').innerHTML = '<div class="fm-empty">暂无文件列表</div>'; return; }

    var h = '<table class="fm-table"><thead><tr>' +
      '<th style="width:20px"></th>' +
      '<th>名称<span style="color:#6e7681;font-weight:400;margin-left:2px">(' + res.items.length + ')</span></th>' +
      '<th style="width:65px;text-align:right">大小</th>' +
      '<th style="width:130px">修改时间</th>' +
      '</tr></thead><tbody>';

    if (path !== '/') {
      h += '<tr class="fm-dir" ondblclick="fmUp()">' +
        '<td class="fm-icon"><span style="color:#79c0ff">&#128193;</span></td>' +
        '<td class="fm-name">..</td><td></td><td></td></tr>';
    }

    res.items.forEach(function(item) {
      var fp = path.endsWith('/') ? path+item.name : path+'/'+item.name;
      var esc = fp.replace(/'/g,"\\'").replace(/"/g,'&quot;');
      var escName = item.name.replace(/'/g,"\\'").replace(/"/g,'&quot;');

      if (item.is_dir) {
        h += '<tr class="fm-dir" ondblclick="fmNavigate(\''+esc+'\')" oncontextmenu="showCtxMenu(event,\''+esc+'\',\''+escHtml(item.name)+'\',true)">' +
          '<td class="fm-icon">'+fmIcon(item)+'</td>' +
          '<td class="fm-name">'+escHtml(item.name)+'</td>' +
          '<td class="fm-size">-</td>' +
          '<td class="fm-time">'+fmTime(item.mtime)+'</td>' +
          '</tr>';
      } else {
        h += '<tr class="fm-file-row" oncontextmenu="showCtxMenu(event,\''+esc+'\',\''+escHtml(item.name)+'\',false)">' +
          '<td class="fm-icon">'+fmIcon(item)+'</td>' +
          '<td class="fm-name">'+escHtml(item.name)+'</td>' +
          '<td class="fm-size">'+fmSize(item.size)+'</td>' +
          '<td class="fm-time">'+fmTime(item.mtime)+'</td>' +
          '</tr>';
      }
    });
    h += '</tbody></table>';
    document.getElementById('fmBody').innerHTML = h;
    // 更新底部状态栏：文件数量 + 总大小
    var fileCount = 0;
    var totalSize = 0;
    res.items.forEach(function(item) {
      if (!item.is_dir) {
        fileCount++;
        totalSize += (item.size || 0);
      }
    });
    var statusText = fileCount + ' 个文件';
    if (totalSize > 0) {
      statusText += ' · 共 ' + fmSize(totalSize);
    }
    document.getElementById('fmStatus').textContent = statusText;
    document.getElementById('fmItemCount').textContent = '';
  } catch(e) {
    document.getElementById('fmBody').innerHTML = '<div class="fm-empty" style="color:#f85149">'+escHtml(e.message)+'</div>';
  }
}

function fmUp() {
  if (fmCurrentPath==='/' || fmCurrentPath==='~' || fmCurrentPath==='') return;
  var p = fmCurrentPath.replace(/\/$/,'').split('/');
  p.pop();
  fmNavigate(p.length<=1?'/':p.join('/'));
}
function fmRefresh() { fmNavigate(fmCurrentPath); }

function fmtBytes(n) {
  if (!n) return '0B';
  if (n < 1024) return n + 'B';
  if (n < 1048576) return (n/1024).toFixed(1) + 'K';
  if (n < 1073741824) return (n/1048576).toFixed(1) + 'M';
  return (n/1073741824).toFixed(1) + 'G';
}

function fmtDuration(sec) {
  if (sec == null || sec === undefined || sec < 0) return '-';
  if (sec < 60) return sec + ' 秒';
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + ' 分 ' + (s > 0 ? s + ' 秒' : '0 秒');
}

var CAP_ICON_PLAY  = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
var CAP_ICON_DL    = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';
var CAP_ICON_DEL   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>';
var CAP_ICON_STOP  = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';

function buildFilterText(addr, port) {
  var parts = [];
  if (addr) {
    var hosts = addr.split(',').map(function(h){return h.trim();}).filter(Boolean);
    if (hosts.length) parts.push(hosts.length > 1 ? '(host ' + hosts.join(' or host ') + ')' : 'host ' + hosts[0]);
  }
  if (port) {
    var ports = port.split(',').map(function(p){return p.trim();}).filter(Boolean);
    if (ports.length) parts.push(ports.length > 1 ? '(port ' + ports.join(' or port ') + ')' : 'port ' + ports[0]);
  }
  return parts.length ? escHtml(parts.join(' ')) : '<span class="all">全部流量</span>';
}

function buildTargetText(addr, port) {
  var a = (addr || '').trim(), p = (port || '').trim();
  if (!a && !p) return '<span class="all">全部流量</span>';
  var t = a || '';
  if (p) t += (t ? ':' : '') + p;
  return escHtml(t);
}

function renderCaptureList(captures) {
  var body = document.getElementById('captureListBody');
  if (!captures || captures.length === 0) {
    body.innerHTML = '<div class="capture-empty">暂无抓包任务，点击「+ 新增抓包」开始。</div>';
    return;
  }
  var html = '<div class="c-head">'
    + '<span>名称</span><span>IP</span><span>端口</span><span>大小</span>'
    + '<span>时长</span><span>状态</span>'
    + '<span class="h-act">操作</span></div>';
  captures.forEach(function(c) {
    var stTxt, stCls, actHtml = '';
    if (c.status === 'pending') {
      stTxt = '待启动'; stCls = 'status-pending';
      actHtml += '<button class="btn-start" data-act="start" data-name="' + escAttr(c.name) + '" title="启动">' + CAP_ICON_PLAY + '</button>';
      actHtml += '<button class="btn-del" data-act="del" data-name="' + escAttr(c.name) + '" title="删除">' + CAP_ICON_DEL + '</button>';
    } else if (c.status === 'running') {
      stTxt = '正在抓包'; stCls = 'status-running';
      actHtml += '<button class="btn-stop" data-act="end" data-name="' + escAttr(c.name) + '" title="结束（停止抓包，保留文件）">' + CAP_ICON_STOP + '</button>';
      actHtml += '<button class="btn-del" data-act="del" data-name="' + escAttr(c.name) + '" title="删除">' + CAP_ICON_DEL + '</button>';
    } else {
      stTxt = '已结束'; stCls = 'status-ended';
      actHtml += '<button class="btn-dl" data-act="dl" data-name="' + escAttr(c.name) + '" title="下载">' + CAP_ICON_DL + '</button>';
      actHtml += '<button class="btn-del" data-act="del" data-name="' + escAttr(c.name) + '" title="删除">' + CAP_ICON_DEL + '</button>';
    }
    html += '<div class="capture-item">'
      + '<div class="c-name" title="' + escAttr(c.name) + '">' + escHtml(c.name) + '</div>'
      + '<div class="c-field">' + escHtml(c.addr || '-') + '</div>'
      + '<div class="c-field">' + escHtml(c.port || '-') + '</div>'
      + '<div class="c-field">' + (c.size_mb != null ? c.size_mb + ' MB' : '-') + '</div>'
      + '<div class="c-field">' + fmtDuration(c.duration) + '</div>'
      + '<span class="status-badge ' + stCls + '">' + stTxt + '</span>'
      + '<div class="c-actions">' + actHtml + '</div>'
      + '</div>';
  });
  body.innerHTML = html;
}

// 操作列事件委托（列表会整体重渲染，故只绑一次）
document.getElementById('captureListBody').addEventListener('click', async function(e) {
  var btn = e.target.closest('button[data-act]');
  if (!btn) return;
  var act = btn.getAttribute('data-act');
  var name = btn.getAttribute('data-name');
  if (act === 'start') await startCaptureTask(name);
  else if (act === 'end') { if (confirm('确认结束抓包 ' + name + ' ？结束后将保留文件，可下载。')) await endCapture(name); }
  else if (act === 'dl') downloadCaptureFile(name);
  else if (act === 'del') { if (confirm('确认删除抓包任务 ' + name + ' ？')) await deleteCapture(name); }
});

// 启动一个「待启动」的任务
async function startCaptureTask(name) {
  try {
    try {
      var b = document.querySelector('button[data-act="start"][data-name="' + name + '"]');
      if (b) { b.disabled = true; b.innerHTML = '<span class="spinner"></span>'; }
    } catch(_) {}
    var r = await api('capture_start', { session_id: sessionId, name: name });
    if (!r.ok) alert('启动失败: ' + (r.error || ''));
    refreshCaptureList();
  } catch(e) { alert('启动异常: ' + e.message); refreshCaptureList(); }
}

// 结束一个正在抓包的任务（停止 tcpdump，保留文件 → 状态「已结束」）
async function endCapture(name) {
  try {
    var r = await api('capture_end', { session_id: sessionId, name: name });
    if (!r.ok) alert('结束失败: ' + (r.error || ''));
    else refreshCaptureList();
  } catch(e) { alert('结束异常: ' + e.message); }
}

async function deleteCapture(name) {
  try {
    var r = await api('capture_delete', { session_id: sessionId, name: name });
    if (!r.ok) alert('删除失败: ' + (r.error || ''));
    else refreshCaptureList();
  } catch(e) { alert('删除异常: ' + e.message); }
}

async function downloadCaptureFile(name) {
  if (!sessionId) return;
  try {
    var r = await fetch('/api/capture_download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, name: name })
    });
    if (r.ok) {
      var blob = await r.blob();
      var u = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = u;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(u);
    } else {
      var err = await r.json().catch(function() { return {}; });
      alert('下载失败: ' + (err.error || r.status));
    }
  } catch(e) { alert('下载异常: ' + e.message); }
}

// ================================================================
//  Context Menu
// ================================================================
function showCtxMenu(e, fp, name, isDir) {
  e.preventDefault();
  e.stopPropagation();
  ctxTarget = { fp: fp, name: name, isDir: isDir };
  var menu = document.getElementById('ctxMenu');
  menu.classList.remove('hidden');
  var x = e.clientX, y = e.clientY;
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
  requestAnimationFrame(function() {
    var rect = menu.getBoundingClientRect();
    if (rect.right > window.innerWidth) menu.style.left = (window.innerWidth - rect.width - 8) + 'px';
    if (rect.bottom > window.innerHeight) menu.style.top = (window.innerHeight - rect.height - 8) + 'px';
  });
}

function hideCtxMenu() {
  document.getElementById('ctxMenu').classList.add('hidden');
  ctxTarget = null;
}

function ctxDownload() {
  if (ctxTarget && !ctxTarget.isDir) {
    fmDownloadFile(ctxTarget.fp);
  }
  hideCtxMenu();
}

function ctxDelete() {
  if (ctxTarget) {
    fmDelete(ctxTarget.fp, ctxTarget.name);
  }
  hideCtxMenu();
}

// Close context menu on click elsewhere
document.addEventListener('click', function() { hideCtxMenu(); });

async function fmDelete(fp, name) {
  if (!confirm('确定删除 '+name+' ?')) return;
  try {
    var r = await fetch('/api/sftp_delete', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: sessionId, path: fp }) });
    var res = await r.json();
    if (res.ok) { fmRefresh(); if(term) term.write('\r\n\x1b[36m[已删除] '+fp+'\x1b[0m\r\n'); }
    else alert(res.error);
  } catch(e) { alert(e.message); }
}

async function fmMkdir() {
  var name = prompt('请输入文件夹名称:');
  if (!name || !name.trim()) return;
  var fp = fmCurrentPath.endsWith('/') ? fmCurrentPath+name.trim() : fmCurrentPath+'/'+name.trim();
  try {
    var r = await fetch('/api/sftp_mkdir', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ session_id: sessionId, path: fp }) });
    var res = await r.json();
    if (res.ok) { fmRefresh(); if(term) term.write('\r\n\x1b[36m[已创建] '+fp+'\x1b[0m\r\n'); }
    else alert(res.error);
  } catch(e) { alert(e.message); }
}

// ================================================================
//  Transfer Progress Bar
// ================================================================
function showProgressBar(filename) {
  var el = document.getElementById('fmProgress');
  el.classList.remove('hidden');
  document.getElementById('fmProgressName').textContent = filename;
  document.getElementById('fmProgressDetail').textContent = '0%';
  document.getElementById('fmProgressFill').style.width = '0%';
  document.getElementById('fmProgressStatus').textContent = '准备中...';
}

function updateProgressBar(transferred, total, percent) {
  var pct = (percent != null) ? percent : (total > 0 ? Math.round(transferred * 100 / total) : 0);
  document.getElementById('fmProgressFill').style.width = pct + '%';
  document.getElementById('fmProgressDetail').textContent = pct + '%';
  var speed = '';
  if (transferred > 0 && total > 0) {
    speed = fmSize(transferred) + ' / ' + fmSize(total);
  }
  document.getElementById('fmProgressStatus').textContent = pct + '%' + (speed ? ' - ' + speed : '');
}

function hideProgressBar() {
  document.getElementById('fmProgress').classList.add('hidden');
  currentTransferId = null;
}

function genTransferId() {
  return 't_' + Date.now() + '_' + Math.random().toString(36).substr(2, 8);
}

// ================================================================
//  Upload
// ================================================================
function fmTriggerUpload() {
  if (!sessionId) { alert('请先连接服务器'); return; }
  document.getElementById('fmFileInput').click();
}

function fmHandleUpload(inp) {
  var f = inp.files[0];
  if (!f) return;
  pendingUploadFile = f;
  var rp = fmCurrentPath.endsWith('/') ? fmCurrentPath+f.name : fmCurrentPath+'/'+f.name;
  document.getElementById('uploadFileName').textContent = f.name;
  document.getElementById('inputUploadPath').value = rp;
  document.getElementById('uploadStatus').textContent = '';
  document.getElementById('uploadModal').classList.remove('hidden');
  inp.value = '';
}

function closeUploadModal() {
  document.getElementById('uploadModal').classList.add('hidden');
}

function doUpload() {
  if (!pendingUploadFile || !sessionId) return;
  var rp = document.getElementById('inputUploadPath').value.trim();
  if (!rp) { alert('请填写远程路径'); return; }

  var theFile = pendingUploadFile;
  var fileName = theFile.name;
  var transferId = genTransferId();
  currentTransferId = transferId;

  // Close upload modal immediately so progress bar in FM is visible
  closeUploadModal();
  pendingUploadFile = null;

  // Show progress bar in FM
  showProgressBar(fileName);
  document.getElementById('fmProgressStatus').textContent = '正在上传到服务器...';

  var fd = new FormData();
  fd.append('session_id', sessionId);
  fd.append('remote_path', rp);
  fd.append('file', theFile);
  fd.append('transfer_id', transferId);

  var xhr = new XMLHttpRequest();

  xhr.upload.addEventListener('progress', function(e) {
    if (e.lengthComputable) {
      var pct = Math.round(e.loaded * 100 / e.total);
      updateProgressBar(e.loaded, e.total, pct);
      document.getElementById('fmProgressStatus').textContent = '上传中 ' + pct + '%';
    }
  });

  xhr.onload = function() {
    try {
      var res = JSON.parse(xhr.responseText);
      if (res.ok) {
        updateProgressBar(1, 1, 100);
        document.getElementById('fmProgressStatus').textContent = '上传完成';
        if (term) term.write('\r\n\x1b[36m[上传成功] ' + fileName + ' -> ' + rp + '\x1b[0m\r\n');
        fmRefresh();
        setTimeout(hideProgressBar, 3000);
        setTimeout(function() { if (socket && socket.connected) socket.emit('term-input', { data: '\n' }); }, 100);
      } else {
        document.getElementById('fmProgressStatus').textContent = '上传失败: ' + res.error;
        if (term) term.write('\r\n\x1b[31m[上传失败] ' + res.error + '\x1b[0m\r\n');
      }
    } catch(e) {
      document.getElementById('fmProgressStatus').textContent = '上传异常: ' + e.message;
    }
    currentTransferId = null;
  };

  xhr.onerror = function() {
    document.getElementById('fmProgressStatus').textContent = '上传失败: 网络错误';
    currentTransferId = null;
  };

  xhr.open('POST', '/api/upload');
  xhr.send(fd);
}

// ================================================================
//  Download
// ================================================================
function fmDownloadFile(fp) {
  if (!sessionId) return;
  var fn = fp.split('/').pop();
  var transferId = genTransferId();
  currentTransferId = transferId;

  if (term) term.write('\r\n\x1b[36m[下载] ' + fn + '\x1b[0m\r\n');

  showProgressBar(fn);
  document.getElementById('fmProgressStatus').textContent = '正在从远程服务器下载...';

  var xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/download');
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.responseType = 'blob';

  xhr.onload = function() {
    if (xhr.status === 200) {
      var blob = xhr.response;
      var cd = xhr.getResponseHeader('Content-Disposition') || '';
      var n = fn;
      var m = cd.match(/filename\*?=(?:UTF-8''|"?)([^";]+)/i);
      if (m) n = decodeURIComponent(m[1].replace(/"/g, ''));
      var u = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = u;
      a.download = n;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(u);

      updateProgressBar(1, 1, 100);
      document.getElementById('fmProgressStatus').textContent = '下载完成';
      if (term) term.write('\x1b[32m[下载完成] ' + n + '\x1b[0m\r\n');
      setTimeout(hideProgressBar, 3000);
      setTimeout(function() { if (socket && socket.connected) socket.emit('term-input', { data: '\n' }); }, 100);
    } else {
      var reader = new FileReader();
      reader.onload = function() {
        try {
          var err = JSON.parse(reader.result);
          var msg = err.error || '下载失败';
          document.getElementById('fmProgressStatus').textContent = msg;
          if (term) term.write('\x1b[31m[下载失败] ' + msg + '\x1b[0m\r\n');
        } catch(e2) {
          document.getElementById('fmProgressStatus').textContent = '下载失败';
        }
      };
      reader.readAsText(xhr.response);
    }
    currentTransferId = null;
  };

  xhr.onerror = function() {
    document.getElementById('fmProgressStatus').textContent = '网络错误';
    if (term) term.write('\x1b[31m[下载失败] 网络错误\x1b[0m\r\n');
    currentTransferId = null;
  };

  xhr.send(JSON.stringify({ session_id: sessionId, remote_path: fp, transfer_id: transferId }));
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') { closeLevel2Modal(); closeUploadModal(); closeCaptureMgmt(); closeNewCapture(); hideCtxMenu(); }
  if (e.key === 'Enter') {
    if (!document.getElementById('level2Modal').classList.contains('hidden')) doLevel2();
    else if (!document.getElementById('uploadModal').classList.contains('hidden')) doUpload();
  }
  if (e.key === 'Delete' && ctxTarget && !ctxTarget.isDir) {
    fmDelete(ctxTarget.fp, ctxTarget.name);
    hideCtxMenu();
  }
});
